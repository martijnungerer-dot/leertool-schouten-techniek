name: Controles

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bouwen-en-testen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Het zelfstandige HTML-bestand staat in de repo omdat het het eindproduct
      # is. Opnieuw bouwen en vergelijken houdt het eerlijk: wie de broncode
      # wijzigt en vergeet te bouwen, loopt hier vast in plaats van bij een
      # tester die een oude versie opent.
      - name: Bouwen
        run: node build/build.cjs

      - name: Is het gebouwde bestand bij de broncode?
        run: |
          if ! git diff --quiet -- Leerplatform.html; then
            echo "Leerplatform.html loopt niet gelijk met src/. Draai 'node build/build.cjs' en commit het resultaat."
            git diff --stat -- Leerplatform.html
            exit 1
          fi

      - name: Controles
        run: node build/test.cjs

      # Een sleutel in het eindbestand is meteen een gelekte sleutel: alles in
      # dat bestand is leesbaar voor iedereen die het opent.
      - name: Geen sleutels in het eindbestand
        run: |
          if grep -qiE '(sk-[a-z0-9_-]{20,}|api[_-]?key["'"'"']?\s*[:=]\s*["'"'"'][A-Za-z0-9_-]{20,})' Leerplatform.html; then
            echo "Er staat iets dat op een API-sleutel lijkt in Leerplatform.html."
            exit 1
          fi
